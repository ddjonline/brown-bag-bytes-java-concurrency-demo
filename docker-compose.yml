    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 5

  api-spring-boot-v4-basic:
    image: api-spring-boot-v4-basic
    container_name: api-spring-boot-v4-basic
    hostname: api-spring-boot-v4-basic
    build: ./api-spring-boot-v4-basic
    ports:
      - "8084:8080"
    networks:
      - poc-concurrency-testing-network
    depends_on:
      resource-vertx:
        condition: service_started
      postgres:
        condition: service_healthy
