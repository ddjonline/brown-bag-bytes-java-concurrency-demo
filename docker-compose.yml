services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./env/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - poc-concurrency-testing-network
    ports:
      - "9090:9090"
    command:
      - --web.enable-remote-write-receiver
      - --enable-feature=native-histograms
      - --config.file=/etc/prometheus/prometheus.yml
  grafana:
    image: grafana/grafana
    container_name: grafana
    networks:
      - poc-concurrency-testing-network
    ports:
      - 3000:3000
    env_file:
      - ./env/grafana.env
    volumes:
      - ./env/grafana:/etc/grafana/provisioning/
  # oracle-db:
  #   image: doctorkirk/oracle-19c
  #   container_name: oracle-db-container
  #   ports:
  #     - "1521:1521" # Oracle Listener port
  #     - "5500:5500" # Oracle Enterprise Manager Express port
  #   networks:
  #     - poc-concurrency-testing-network
