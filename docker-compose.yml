  #     - ./env/oracle/init-scripts/seed_data.sql:/opt/oracle/scripts/setup/seed_data.sql
  #     # - /path/to/your/local/oradata:/opt/oracle/oradata # Uncomment if the data should be persistent
  #   shm_size: '1g' # bare minimum memory per oracle docs
  #   cpu_count: 2
  #   healthcheck:
  #     test: ["CMD", "sqlplus", "-L", "sys/my_awesome_password@ORCLPDB1", "as", "sysdba", "-S", "@healthcheck.sql"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  postgres-db:
    image: postgres:latest
    container_name: postgres-db
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: my_awesome_password
    volumes:
      - ./env/postgres/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - poc-concurrency-testing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
  maria-db:
    image: mariadb:latest
    container_name: maria-db
    environment:
      MARIADB_ROOT_PASSWORD: my_awesome_root_password
      MARIADB_DATABASE: my_database # This can be the same as in schema.sql or a different one
      MARIADB_USER: user
      MARIADB_PASSWORD: my_awesome_password
    ports:
      - "3306:3306"
    networks:
      - poc-concurrency-testing-network
    volumes:
      - ./env/mariadb/init-scripts/1_schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./env/mariadb/init-scripts/2_seed_data.sql:/docker-entrypoint-initdb.d/2_seed_data.sql
      # - ./env/mariadb/mariadb_data:/var/lib/mysql # Optional: for persistent data storage
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"] # Simple connectivity check
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s # Give the database time to initialize


  resource-vertx:
    image: resource-vertx
    build: ./resource-vertx
    ports:
      - "9080:8080"
    networks:
      - poc-concurrency-testing-network
    depends_on:
      - maria-db
    cpu_count: 1




networks:
  poc-concurrency-testing-network:
    driver: bridge